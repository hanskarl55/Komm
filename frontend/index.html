<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kommunikator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container dark-mode">

    <!-- Eingabefeld -->
    <input type="text" id="input" placeholder="Gib ein Stichwort ein..." autofocus />

    <!-- Autocomplete-Vorschläge -->
    <div id="autocomplete" class="suggestion-row"></div>

    <!-- Virtuelle Tastatur -->
    <div id="keyboard" class="keyboard"></div>

    <!-- Steuerbuttons -->
    <div id="controls">
      <button id="generate" class="control wide">🧠 Vorschläge</button>
      <button id="speak" class="control">🗣 Sprechen</button>
      <button id="clear" class="control">🗑 Löschen</button>
      <button id="language" class="control">🌍 DE</button>
    </div>

    <!-- Chatverlauf (optional sichtbar machen) -->
    <div id="chat" class="chat-display"></div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
